  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-6 space-y-5 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <span>⚙️</span> 应用设置
        </h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1 text-lg">✕</button>
      </div>

      <!-- API Key Configuration Section -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-300">
          🔑 Google Gemini API Key
        </label>
        <p class="text-[11px] text-slate-400 leading-relaxed">
          用于拍照识别生词。免费在 <a href="https://aistudio.google.com/" target="_blank" class="text-amber-400 underline">aistudio.google.com</a> 获取。
        </p>
        <div class="relative">
          <input 
            type="password" 
            id="setting-api-key" 
            placeholder="粘贴 AIzaSy... 密钥" 
            class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition pr-16"
          />
          <button 
            type="button" 
            onclick="toggleApiKeyVisibility()" 
            id="toggle-key-btn"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-[11px] text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-700/60"
          >
            显示
          </button>
        </div>
        <button 
          onclick="saveApiKeyFromModal()" 
          class="w-full mt-2 py-2.5 px-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs rounded-xl shadow transition active:scale-[0.98]"
        >
          保存 API Key 到手机
        </button>
      </div>

      <div class="pt-2 border-t border-slate-800 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-300">数据备份与导出</span>
          <button onclick="exportVocabularyJSON()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            导出 JSON
          </button>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-rose-400">清空所有生词</span>
          <button onclick="confirmClearAllVocabulary()" class="text-xs bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 px-3 py-1.5 rounded-lg border border-rose-800/40 transition">
            重置词库
          </button>
        </div>
      </div>
    </div>
  </div>
